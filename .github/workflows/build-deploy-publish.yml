name: Build, Test, Publish, and Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: "Pack and publish NuGet packages"
        required: false
        default: false
        type: boolean

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.version.outputs.should_publish }}
      package_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          SHOULD_PUBLISH=false
          VERSION=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SHOULD_PUBLISH=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_nuget }}" == "true" ]]; then
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
            SHOULD_PUBLISH=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Resolved version='${VERSION}', should_publish=${SHOULD_PUBLISH}"

      - name: Restore dependencies
        run: dotnet restore DP.Blazor.MapLibre.slnx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            src/DP.Blazor.MapLibre/ts/package-lock.json
            tests/browser/package-lock.json

      - name: TypeScript facade typecheck/build
        working-directory: src/DP.Blazor.MapLibre/ts
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build library and plugins
        run: |
          VERSION_ARG=""
          if [[ -n "${{ steps.version.outputs.version }}" ]]; then
            VERSION_ARG="/p:Version=${{ steps.version.outputs.version }}"
          fi
          dotnet build src/DP.Blazor.MapLibre/DP.Blazor.MapLibre.csproj --no-restore -c Release /p:ContinuousIntegrationBuild=true $VERSION_ARG
          for proj in \
            src/plugins/DP.Blazor.MapLibre.TerraDrawPlugin/DP.Blazor.MapLibre.TerraDrawPlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.ComparePlugin/DP.Blazor.MapLibre.ComparePlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.MinimapPlugin/DP.Blazor.MapLibre.MinimapPlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.FrameratePlugin/DP.Blazor.MapLibre.FrameratePlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.GeoGridPlugin/DP.Blazor.MapLibre.GeoGridPlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.StarfieldPlugin/DP.Blazor.MapLibre.StarfieldPlugin.csproj
          do
            dotnet build "$proj" --no-restore -c Release /p:ContinuousIntegrationBuild=true $VERSION_ARG
          done

      - name: Build and run tests
        run: |
          dotnet build tests/DP.Blazor.MapLibre.Tests/DP.Blazor.MapLibre.Tests.csproj --no-restore -c Release /p:ContinuousIntegrationBuild=true
          dotnet test tests/DP.Blazor.MapLibre.Tests/DP.Blazor.MapLibre.Tests.csproj --no-build -c Release --verbosity normal

      - name: Playwright lifecycle suite
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Pack NuGet packages
        if: steps.version.outputs.should_publish == 'true'
        run: |
          mkdir -p nuget
          VERSION_ARG="/p:Version=${{ steps.version.outputs.version }}"
          for proj in \
            src/DP.Blazor.MapLibre/DP.Blazor.MapLibre.csproj \
            src/plugins/DP.Blazor.MapLibre.TerraDrawPlugin/DP.Blazor.MapLibre.TerraDrawPlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.ComparePlugin/DP.Blazor.MapLibre.ComparePlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.MinimapPlugin/DP.Blazor.MapLibre.MinimapPlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.FrameratePlugin/DP.Blazor.MapLibre.FrameratePlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.GeoGridPlugin/DP.Blazor.MapLibre.GeoGridPlugin.csproj \
            src/plugins/DP.Blazor.MapLibre.StarfieldPlugin/DP.Blazor.MapLibre.StarfieldPlugin.csproj
          do
            dotnet pack "$proj" -c Release --no-build --output nuget $VERSION_ARG
          done
          ls -la nuget

      - name: Upload NuGet artifacts
        if: steps.version.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: nuget/

      - name: Build documentation site
        if: github.ref == 'refs/heads/main'
        run: dotnet build docs/DP.Blazor.MapLibre.Documentation.csproj -c Release -o blazor_build_output /p:ContinuousIntegrationBuild=true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: blazor_build_output/dist

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.outputs.should_publish == 'true'

    # Required for GitHub OIDC → short-lived NuGet API key (Trusted Publishing).
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        run: dotnet nuget push "nuget/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
