name: PR Build and Test

on:
  pull_request:
    branches:
      - main
      - "release/*"

jobs:
  pr-build:
    name: Build Projects
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - src/DP.Blazor.MapLibre/DP.Blazor.MapLibre.csproj
          - docs/DP.Blazor.MapLibre.Documentation.csproj
          - examples/DP.Blazor.MapLibre.Examples/DP.Blazor.MapLibre.Examples.csproj
          - examples/DP.Blazor.MapLibre.Examples.MapboxGlPlugin/DP.Blazor.MapLibre.Examples.MapboxGlPlugin.csproj
          - src/plugins/DP.Blazor.MapLibre.TerraDrawPlugin/DP.Blazor.MapLibre.TerraDrawPlugin.csproj
          - src/plugins/DP.Blazor.MapLibre.ComparePlugin/DP.Blazor.MapLibre.ComparePlugin.csproj
          - src/plugins/DP.Blazor.MapLibre.MinimapPlugin/DP.Blazor.MapLibre.MinimapPlugin.csproj
          - src/plugins/DP.Blazor.MapLibre.FrameratePlugin/DP.Blazor.MapLibre.FrameratePlugin.csproj
          - src/plugins/DP.Blazor.MapLibre.GeoGridPlugin/DP.Blazor.MapLibre.GeoGridPlugin.csproj

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore all project dependencies
        run: dotnet restore DP.Blazor.MapLibre.slnx

      - name: Build ${{ matrix.project }}
        run: dotnet build ${{ matrix.project }} --no-restore -c Release

  pr-test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: pr-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore DP.Blazor.MapLibre.slnx

      - name: Build test project
        run: dotnet build tests/DP.Blazor.MapLibre.Tests/DP.Blazor.MapLibre.Tests.csproj --no-restore -c Release

      - name: Run tests
        run: dotnet test tests/DP.Blazor.MapLibre.Tests/DP.Blazor.MapLibre.Tests.csproj --no-build -c Release --verbosity normal
