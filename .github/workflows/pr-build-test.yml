name: PR Build and Test

on:
  pull_request:
    branches:
      - main
      - "release/*"

jobs:
  pr-ts:
    name: TypeScript Facade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DP.Blazor.MapLibre/ts/package-lock.json

      - name: TypeScript facade typecheck/build
        working-directory: src/DP.Blazor.MapLibre/ts
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

  pr-projects:
    name: Discover projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List buildable projects
        id: list
        shell: bash
        run: |
          # Core projects are listed explicitly; plugins are globbed so a new
          # src/plugins/**/*.csproj is picked up without editing this workflow.
          json=$({
            echo 'src/DP.Blazor.MapLibre/DP.Blazor.MapLibre.csproj'
            echo 'docs/DP.Blazor.MapLibre.Documentation.csproj'
            echo 'examples/DP.Blazor.MapLibre.Examples/DP.Blazor.MapLibre.Examples.csproj'
            echo 'examples/DP.Blazor.MapLibre.Examples.MapboxGlPlugin/DP.Blazor.MapLibre.Examples.MapboxGlPlugin.csproj'
            ls -1 src/plugins/*/*.csproj
          } | sed 's#.*#"&"#' | paste -sd, -)
          echo "matrix=[$json]" >> "$GITHUB_OUTPUT"

  pr-build:
    name: Build Projects
    needs: [pr-projects]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJson(needs.pr-projects.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore DP.Blazor.MapLibre.slnx

      - name: Build ${{ matrix.project }}
        run: dotnet build ${{ matrix.project }} --no-restore -c Release

  pr-test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [pr-build, pr-ts]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore DP.Blazor.MapLibre.slnx

      - name: Build test project
        run: dotnet build tests/DP.Blazor.MapLibre.Tests/DP.Blazor.MapLibre.Tests.csproj --no-restore -c Release

      - name: Run tests
        run: dotnet test tests/DP.Blazor.MapLibre.Tests/DP.Blazor.MapLibre.Tests.csproj --no-build -c Release --verbosity normal

  pr-browser:
    name: Playwright Lifecycle
    runs-on: ubuntu-latest
    needs: [pr-build, pr-ts]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test deps
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright lifecycle suite
        working-directory: tests/browser
        run: npm test
