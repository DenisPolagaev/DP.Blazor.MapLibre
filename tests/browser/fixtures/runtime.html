<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MapLibre runtime harness</title>
  <link rel="stylesheet" href="/_content/DP.Blazor.MapLibre/maplibre-gl/dist/maplibre-gl.css" />
  <style>
    html, body, #map { margin: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    // Loads the real MapLibre.razor.js that Blazor ships, so these checks cover the code the components run.
    import * as api from '/_content/DP.Blazor.MapLibre/MapLibre.razor.js';

    globalThis.__api = api;
    try {
      const stubReference = { invokeMethodAsync: async () => undefined, invokeMethod: () => 'null' };
      globalThis.__map = await api.initializeMap({
        container: 'map',
        style: { version: 8, sources: {}, layers: [] },
        center: [0, 0],
        zoom: 1,
        attributionControl: false,
      }, stubReference, null);
      globalThis.__ready = true;
    } catch (error) {
      globalThis.__error = String((error && error.stack) || error);
    }
  </script>
</body>
</html>
